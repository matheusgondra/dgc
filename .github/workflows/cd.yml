name: CD Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    name: Build Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: dgc-linux-x86_64
            bin_path: build/dgc
          - os: windows-latest
            asset_name: dgc-windows-x86_64.exe
            bin_path: build/dgc.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ninja and CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake gcc

      - name: Setup MinGW-w64 & Ninja (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c
        with:
          msystem: UCRT64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-cmake

      - name: Configure & Build (Release)
        shell: bash
        run: |
          cmake -E remove_directory build
          cmake --preset gcc -DCMAKE_BUILD_TYPE=Release
          cmake --build --preset gcc --config Release

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.bin_path }}" "dist/${{ matrix.asset_name }}"

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  publish-release:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          generate_release_notes: true
          files: artifacts/*